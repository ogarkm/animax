<!-- --- discover.html --- -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discover</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../static/phosphor.js"></script>
    <style>
        :root {
            --accent: var(--brand, #8FE7EC);
            --accent-dim: var(--brand-dim, rgba(143, 231, 236, 0.15));
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --spring-snappy: cubic-bezier(0.19, 1, 0.22, 1);
        }

        body {
            background: var(--bg-app, #050505) !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Modern dynamic viewport compatibility */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .command-menu {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* ─────────────────────────────────────────────────────────
           SEARCH HEADER
        ───────────────────────────────────────────────────────── */
        .search-header {
            display: flex;
            align-items: center;
            padding: 16px 20px 12px;
            gap: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .search-icon {
            font-size: 20px;
            color: var(--accent);
            flex-shrink: 0;
            animation: searchPulse 3s ease-in-out infinite;
        }

        @keyframes searchPulse {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(143, 231, 236, 0.1)); }
            50%       { filter: drop-shadow(0 0 8px rgba(143, 231, 236, 0.4)); }
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary, #ffffff);
            font-size: 16px; /* Prevents auto-zoom on iOS */
            font-family: inherit;
            letter-spacing: -0.015em;
            caret-color: var(--accent);
            min-width: 0;
        }

        #search-input::placeholder {
            color: var(--text-muted, #5c5c60);
        }

        .shortcut-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 0.65rem;
            color: var(--text-muted, #5c5c60);
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            pointer-events: none;
            display: none;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .shortcut-badge { display: block; }
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary, #8E8E93);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.2s var(--ease-out-expo), background 0.2s var(--ease-out-expo);
        }

        .close-btn:hover {
            color: var(--text-primary, #ffffff);
            background: rgba(255, 255, 255, 0.06);
        }

        /* ─────────────────────────────────────────────────────────
           FILTER PILLS (Pinned sibling container)
        ───────────────────────────────────────────────────────── */
        .pill-filters-container {
            position: relative;
            width: 100%;
            padding: 0 20px 12px;
            flex-shrink: 0;
            background: var(--bg-app, #050505);
            z-index: 5;
        }

        /* Subtle bottom divider below the fixed navigation items */
        .pill-filters-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.03) 15%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 85%,
                transparent 100%
            );
        }

        .pill-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0 8px;
            scroll-snap-type: x mandatory;
        }

        .pill-filter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary, #8E8E93);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            scroll-snap-align: start;
            transition: all 0.2s var(--ease-out-expo);
        }

        @media (hover: hover) and (pointer: fine) {
            .pill-filter:not(.active):hover {
                border-color: rgba(255, 255, 255, 0.15);
                color: var(--text-primary, #ffffff);
                background: rgba(255, 255, 255, 0.06);
            }
        }

        .pill-filter:active {
            transform: scale(0.95);
        }

        .pill-filter.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #050505;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--accent-dim);
        }

        /* ─────────────────────────────────────────────────────────
           SCROLLABLE RESULTS BODY
        ───────────────────────────────────────────────────────── */
        .discover-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* ─────────────────────────────────────────────────────────
           RESULTS SECTION
        ───────────────────────────────────────────────────────── */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .section-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
            flex-shrink: 0;
        }

        .section-title-text {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted, #5c5c60);
        }

        /* ─────────────────────────────────────────────────────────
           RESULT ITEMS
        ───────────────────────────────────────────────────────── */
        @keyframes resultFadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            color: var(--text-secondary, #8E8E93);
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
            background: rgba(255, 255, 255, 0.01);
            animation: resultFadeUp 0.35s var(--ease-out-expo) both;
            transition: all 0.22s var(--ease-out-expo);
        }

        @media (hover: hover) and (pointer: fine) {
            .result-item:hover {
                background: rgba(255, 255, 255, 0.03);
                color: var(--text-primary, #ffffff);
                border-color: rgba(255, 255, 255, 0.06);
                transform: translateX(2px);
            }
        }

        .result-item:active {
            transform: scale(0.98) translateX(1px);
        }

        .result-item.selected {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-dim);
            color: var(--text-primary, #ffffff);
        }

        .result-poster-wrap {
            width: 38px;
            height: 52px;
            border-radius: 6px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            flex-shrink: 0;
            position: relative;
            transition: border-color 0.2s var(--ease-out-expo);
        }

        .result-item.selected .result-poster-wrap {
            border-color: var(--accent);
        }

        .result-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-poster-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted, #5c5c60);
        }

        .result-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .result-title {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-primary, #ffffff);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.01em;
        }

        .result-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--text-secondary, #8E8E93);
        }

        .meta-badge {
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary, #8E8E93);
        }

        .result-trailing {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .result-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-primary, #ffffff);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .result-rating i {
            font-size: 0.75rem;
            color: var(--accent);
        }

        /* ─── Atomic Indicator ────────────────────────────────── */
        .atomic-indicator {
            position: relative;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s var(--ease-out-expo);
            flex-shrink: 0;
        }

        .result-item:hover .atomic-indicator,
        .result-item.selected .atomic-indicator {
            opacity: 1;
        }

        .chevron-arrow {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95rem;
            transform: translateX(-3px);
            transition: transform 0.35s var(--spring-snappy);
        }

        .result-item:hover .chevron-arrow,
        .result-item.selected .chevron-arrow {
            transform: translateX(0);
        }

        @media (pointer: coarse) {
            .atomic-indicator {
                display: none;
            }
        }

        .dot-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
        }

        @media (hover: hover) and (pointer: fine) {
            .result-item:hover .dot-1 { animation: atomicDot1 0.45s var(--spring-snappy) forwards; }
            .result-item:hover .dot-2 { animation: atomicDot2 0.45s var(--spring-snappy) forwards; }
        }

        @keyframes atomicDot1 {
            0%   { opacity: 1; transform: translate(-8px, -6px) scale(2); }
            100% { opacity: 0; transform: translate(0, 0) scale(0); }
        }
        @keyframes atomicDot2 {
            0%   { opacity: 1; transform: translate(8px, 6px) scale(2); }
            100% { opacity: 0; transform: translate(0, 0) scale(0); }
        }

        /* ─────────────────────────────────────────────────────────
           LOADING SKELETONS
        ───────────────────────────────────────────────────────── */
        @keyframes shimmer {
            from { background-position: -280px 0; }
            to   { background-position: 280px 0; }
        }

        .skeleton-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
        }

        .skeleton-block {
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0.02) 0%,
                rgba(255,255,255,0.06) 50%,
                rgba(255,255,255,0.02) 100%
            );
            background-size: 280px 100%;
            animation: shimmer 1.5s linear infinite;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .sk-poster { width: 38px; height: 52px; border-radius: 6px; }
        .sk-body   { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .sk-title  { height: 12px; width: 60%; }
        .sk-meta   { height: 8px;  width: 35%; }
        .sk-rating { width: 28px; height: 12px; }

        /* ─────────────────────────────────────────────────────────
           EMPTY STATE
        ───────────────────────────────────────────────────────── */
        .no-results {
            padding: 48px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .no-results-icon {
            font-size: 28px;
            color: var(--text-muted, #5c5c60);
            margin-bottom: 4px;
        }

        .no-results-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary, #8E8E93);
        }

        .no-results-sub {
            font-size: 0.76rem;
            color: var(--text-muted, #5c5c60);
        }

        /* ─────────────────────────────────────────────────────────
           RESPONSIVE OVERRIDES FOR MOBILE DEVICE VIEWPORTS
        ───────────────────────────────────────────────────────── */
        @media (max-width: 480px) {
            .search-header {
                padding: 12px 16px 8px;
            }
            .pill-filters-container {
                padding: 0 16px 10px;
            }
            .discover-content {
                padding: 6px 16px 20px;
                gap: 12px;
            }
            .result-item {
                padding: 8px 10px;
                border-radius: 10px;
                gap: 10px;
            }
            .result-poster-wrap {
                width: 34px;
                height: 46px;
            }
            .result-title {
                font-size: 0.84rem;
            }
        }
    </style>
</head>
<body>

    <div class="command-menu">

        <!-- ── Search Header ───────────────────────────────────── -->
        <div class="search-header">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input
                type="text"
                id="search-input"
                placeholder="Search anime, movies, TV..."
                autofocus
                autocomplete="off"
                spellcheck="false"
            >
            <span class="shortcut-badge">ESC</span>
            <button class="close-btn" onclick="closeSpotlight()" aria-label="Close panel">
                <i class="ph ph-x"></i>
            </button>
        </div>

        <!-- ── Filter Pills (Pinned) ───────────────────────────── -->
        <div class="pill-filters-container">
            <div class="pill-filters">
                <button class="pill-filter active" onclick="setFilter(this, 'all')">All</button>
                <button class="pill-filter" onclick="setFilter(this, 'anime')">Anime</button>
                <button class="pill-filter" onclick="setFilter(this, 'manga')">Manga</button>
                <button class="pill-filter" onclick="setFilter(this, 'tv')">TV Shows</button>
                <button class="pill-filter" onclick="setFilter(this, 'movie')">Movies</button>
            </div>
        </div>

        <!-- ── Scrollable Discover Body ────────────────────────── -->
        <div class="discover-content">
            <!-- Results target area -->
            <div id="results-target" class="results-section"></div>
        </div>

    </div>

    <script>
        let activeFilter   = 'all';
        let rawResults     = [];
        let filteredResults = [];
        let selectedIndex  = -1;
        let debounceTimer  = null;

        const searchInput   = document.getElementById('search-input');
        const resultsTarget = document.getElementById('results-target');

        // ── Debounced Input ──────────────────────────────────────
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            showSkeleton();
            debounceTimer = setTimeout(() => {
                performSearch(searchInput.value.trim());
            }, 200);
        });

        // ── Fetch Trending (Home Page Feed) ──────────────────────
        async function loadTrending() {
            showSkeleton();
            try {
                const res = await fetch('/api/home');
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                rawResults = [];
                for (const section in data) {
                    if (Array.isArray(data[section])) {
                        data[section].forEach(item => {
                            if (!rawResults.some(r => r.id === item.id)) {
                                rawResults.push(item);
                            }
                        });
                    }
                }
                renderResults('Trending');
            } catch (err) {
                console.error("Failed to load trending items:", err);
                rawResults = [];
                renderResults('Trending');
            }
        }

        // ── Core Search ──────────────────────────────────────────
        async function performSearch(query) {
            selectedIndex = -1;

            if (!query) {
                await loadTrending();
                return;
            }

            try {
                const res = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error();
                rawResults = await res.json();
            } catch (err) {
                console.error("Failed to perform search:", err);
                rawResults = [];
            }

            renderResults('Results');
        }

        // ── Skeleton Loader ──────────────────────────────────────
        function showSkeleton() {
            resultsTarget.innerHTML = [0,1,2,3].map((_, i) => `
                <div class="skeleton-item" style="animation-delay:${i * 38}ms">
                    <div class="skeleton-block sk-poster"></div>
                    <div class="sk-body">
                        <div class="skeleton-block sk-title"></div>
                        <div class="skeleton-block sk-meta"></div>
                    </div>
                    <div class="skeleton-block sk-rating"></div>
                </div>
            `).join('');
        }

        // ── Filter Controls ──────────────────────────────────────
        function setFilter(btn, value) {
            document.querySelectorAll('.pill-filter').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            activeFilter  = value;
            selectedIndex = -1;
            renderResults();
        }

        // ── Render Engine ────────────────────────────────────────
        function renderResults(sectionTitle = null) {
            filteredResults = rawResults.filter(item =>
                activeFilter === 'all' || item.type === activeFilter
            );

            const label = sectionTitle ||
                (activeFilter === 'all'
                    ? 'All Media'
                    : activeFilter.charAt(0).toUpperCase() + activeFilter.slice(1));

            if (filteredResults.length === 0) {
                resultsTarget.innerHTML = `
                    <div class="no-results">
                        <i class="ph ph-magnifying-glass no-results-icon"></i>
                        <div class="no-results-title">No matches found</div>
                        <div class="no-results-sub">Try adjusting your filters or terms</div>
                    </div>
                `;
                return;
            }

            resultsTarget.innerHTML = `
                <div class="section-label">
                    <span class="section-dot"></span>
                    <span class="section-title-text">${label}</span>
                </div>
                ${filteredResults.map((item, i) => `
                    <div class="result-item"
                         data-id="${item.id}"
                         data-index="${i}"
                         onclick="selectItem('${item.id}')"
                         style="animation-delay: ${i * 35}ms">

                        <div class="result-poster-wrap">
                            <img class="result-poster"
                                 src="${item.poster_url || ''}"
                                 alt=""
                                 loading="lazy"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="result-poster-fallback" style="display: none;">
                                <i class="ph ph-image"></i>
                            </div>
                        </div>

                        <div class="result-info">
                            <div class="result-title">${item.title}</div>
                            <div class="result-meta">
                                <span class="meta-badge">${item.type}</span>
                                <span>${item.release_year || '—'}</span>
                            </div>
                        </div>

                        <div class="result-trailing">
                            <div class="result-rating">
                                <i class="ph-fill ph-star"></i>
                                <span>${item.rating != null ? item.rating.toFixed(1) : '—'}</span>
                            </div>
                            <span class="atomic-indicator">
                                <span class="dot-particle dot-1"></span>
                                <span class="dot-particle dot-2"></span>
                                <span class="chevron-arrow">&#8250;</span>
                            </span>
                        </div>
                    </div>
                `).join('')}
            `;

            updateSelection();
        }

        // ── postMessage Bus ──────────────────────────────────────
        function selectItem(id) {
            window.parent.postMessage({ type: 'DISCOVER_SELECT', id }, '*');
        }

        function closeSpotlight() {
            window.parent.postMessage({ type: 'CLOSE_DISCOVER' }, '*');
        }

        // ── Keyboard Navigation ──────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeSpotlight(); return; }
            if (!filteredResults.length) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, filteredResults.length - 1);
                updateSelection();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, 0);
                updateSelection();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedIndex >= 0) selectItem(filteredResults[selectedIndex].id);
            }
        });

        function updateSelection() {
            document.querySelectorAll('.result-item').forEach((el, i) => {
                const isSelected = i === selectedIndex;
                el.classList.toggle('selected', isSelected);
                if (isSelected) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            });
        }

        // ── External Message Handlers ────────────────────────────
        window.addEventListener('message', ({ data }) => {
            if (data.type === 'FOCUS_SEARCH') {
                searchInput.value = '';
                performSearch('');
                setTimeout(() => searchInput.focus(), 50);
            } else if (data.type === 'CLEAR_SEARCH') {
                searchInput.value = '';
                rawResults = filteredResults = [];
                resultsTarget.innerHTML = '';
            }
        });

        // Initialize with default Trending feed on mount
        performSearch('');
    </script>
</body>
</html>
