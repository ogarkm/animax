<!-- --- info.html --- -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Details</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../static/phosphor.js"></script>
    <style>
        :root {
            --accent: var(--brand, #8FE7EC);
            --accent-dim: var(--brand-dim, rgba(143, 231, 236, 0.15));
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --spring-snappy: cubic-bezier(0.19, 1, 0.22, 1);
            --surface-card: rgba(255, 255, 255, 0.02);
            --border-card: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--bg-app, #050505) !important;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text-primary, #ffffff);
            min-height: 100vh;
        }

        /* ── Full Width Scalable Container ────────────────────── */
        .details-container {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Full Bleed Hero Section ────────────────────────── */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 75vh; /* Scales with screen height */
            min-height: 440px;
            display: flex;
            align-items: flex-end;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(75deg, #050505 25%, rgba(5, 5, 5, 0.8) 45%, rgba(5, 5, 5, 0) 80%),
                linear-gradient(360deg, #050505 0%, rgba(5, 5, 5, 0) 50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 0 max(4vw, 24px) 48px;
            box-sizing: border-box;
        }

        .media-logo-wrap {
            max-width: min(45vw, 360px);
            margin-bottom: 20px;
        }

        .media-logo {
            max-height: 120px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6));
        }

        .fallback-title {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            margin: 0;
            line-height: 1.05;
            text-shadow: 0 2px 14px rgba(0,0,0,0.7);
        }

        .media-tagline {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            font-style: italic;
            color: var(--text-secondary, #8E8E93);
            margin: -8px 0 20px;
            max-width: 640px;
            line-height: 1.4;
            opacity: 0.9;
        }

        /* ── Metadata Badges ─────────────────────────────────── */
        .metadata-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary, #8E8E93);
            letter-spacing: 0.02em;
        }

        .badge-star {
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-star i {
            color: var(--accent);
        }

        /* ── Action Buttons ──────────────────────────────────── */
        .action-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-primary {
            background: #ffffff;
            color: #050505;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            padding: 12px 28px;
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 12px 24px;
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s var(--ease-out-expo);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s var(--ease-out-expo);
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .availability-notice {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 12px 16px;
            border: 1px solid rgba(143, 231, 236, 0.25);
            border-radius: 10px;
            background: rgba(143, 231, 236, 0.07);
            color: rgba(255, 255, 255, 0.78);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .availability-notice i {
            color: var(--accent);
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .availability-notice strong {
            color: #ffffff;
            font-weight: 700;
        }

        .btn-primary.coming-soon {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.14);
            cursor: default;
        }

        .btn-primary.coming-soon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ── Split Layout Content Body ────────────────────────── */
        .info-body-grid {
            padding: 48px max(4vw, 24px) 80px;
            box-sizing: border-box;
        }

        .details-split-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 48px;
            align-items: start;
        }

        .main-col {
            display: flex;
            flex-direction: column;
            gap: 48px;
            min-width: 0;
        }

        .sidebar-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .synopsis-text {
            font-size: 0.96rem;
            line-height: 1.6;
            color: var(--text-secondary, #8E8E93);
            margin: 0;
        }

        /* ── Sidebar Component Card ────────────────────────── */
        .sidebar-card {
            background: var(--surface-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted, #5c5c60);
            font-weight: 700;
            margin: 0;
        }

        .sidebar-value {
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text-primary, #ffffff);
        }

        .studio-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 6px;
            margin-bottom: 6px;
            color: var(--text-secondary, #8E8E93);
        }

        /* ── Dynamic Episode Selection ───────────────────────── */
        .episodes-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .episodes-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .season-selector {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s var(--ease-out-expo);
        }

        .season-selector:focus {
            border-color: var(--accent);
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: var(--surface-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.22s var(--ease-out-expo), border-color 0.22s var(--ease-out-expo), background-color 0.22s var(--ease-out-expo);
        }

        .episode-card:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .ep-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(255, 255, 255, 0.01);
        }

        .ep-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ep-number {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .ep-card-body {
            padding: 14px;
        }

        .ep-card-title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .ep-card-desc {
            font-size: 0.78rem;
            color: var(--text-secondary, #8E8E93);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        /* ── Shelves & Slide Rails ───────────────────────────── */
        .shelf {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .shelf-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.015em;
        }

        .shelf-rail {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0;
        }

        /* ── Cast Card Layout ────────────────────────────────── */
        .cast-card {
            width: 120px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cast-avatar-wrap {
            width: 120px;
            height: 156px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cast-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cast-name {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cast-role {
            font-size: 0.7rem;
            color: var(--text-muted, #5c5c60);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Recommendations Card ────────────────────────────── */
        .rec-card-wrap {
            width: 140px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }

        .poster-card {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.25s var(--ease-out-expo), border-color 0.25s var(--ease-out-expo);
        }

        .rec-card-wrap:hover .poster-card {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rec-title {
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary, #ffffff);
            text-align: center;
        }

        /* ── Shimmer Loaders ─────────────────────────────────── */
        @keyframes shimmer {
            from { background-position: -280px 0; }
            to   { background-position: 280px 0; }
        }

        .shimmer-bg {
            background: linear-gradient(90deg, rgba(255,255,255,0.01) 0%, rgba(255,255,255,0.04) 50%, rgba(255,255,255,0.01) 100%);
            background-size: 280px 100%;
            animation: shimmer 1.5s linear infinite;
        }

        .skeleton-logo { height: 80px; width: 280px; border-radius: 8px; margin-bottom: 20px; }
        .skeleton-desc { height: 16px; width: 75%; border-radius: 4px; margin-bottom: 8px; }

        /* ── Lifted Cover / Trailer Lightbox ─────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
        }

        .modal-content {
            position: relative;
            width: min(90vw, 880px);
            aspect-ratio: 16/9;
            background: #000000;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.3s var(--ease-out-expo);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 10;
            transition: background 0.2s, transform 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .modal-video-container {
            width: 100%;
            height: 100%;
        }

        .modal-video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Breakpoints ─────────────────────────────────────── */
        @media (max-width: 992px) {
            .details-split-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        @media (max-width: 768px) {
            .hero-banner {
                height: 50vh;
                min-height: 380px;
            }
            .hero-content {
                padding: 0 20px 32px;
            }
            .info-body-grid {
                padding: 32px 20px 60px;
            }
            .episodes-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 14px;
            }
            .rec-card-wrap {
                width: 120px;
            }
            .poster-card {
                height: 172px;
            }
        }
    </style>
</head>
<body>

    <div class="details-container">
        <!-- Dynamic Layout Target -->
        <div id="media-content-target">
            <div class="hero-banner shimmer-bg"></div>
            <div class="info-body-grid">
                <div class="skeleton-logo shimmer-bg"></div>
                <div class="skeleton-desc shimmer-bg"></div>
                <div class="skeleton-desc shimmer-bg" style="width: 50%;"></div>
            </div>
        </div>
    </div>

    <!-- Embedded Trailer Lightbox (Lifted Cover) -->
    <div id="trailer-modal" class="modal-overlay" onclick="closeTrailerOnOverlay(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeTrailer()" aria-label="Close Trailer">
                <i class="ph ph-x"></i>
            </button>
            <div class="modal-video-container">
                <iframe id="trailer-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        let currentMedia = null;

        function getMediaIdParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || params.get('media_id');
        }

        function getDisplayType(media) {
            const format = (media.format || media.sub_type || '').toUpperCase();
            if (format === 'MOVIE' || media.type === 'movie' || media.id.startsWith('tm')) return 'Movie';
            if (format === 'OVA') return 'OVA';
            if (media.id.startsWith('a') || media.type === 'anime') return 'Anime';
            if (media.id.startsWith('tt') || media.type === 'tv') return 'TV Show';
            return media.type || 'Media';
        }

        function formatRuntime(minutes) {
            if (!minutes) return '';
            const hours = Math.floor(minutes / 60);
            const remainingMinutes = minutes % 60;
            return hours > 0 ? `${hours}h ${remainingMinutes}m` : `${remainingMinutes}m`;
        }

        async function loadMediaDetails(mediaId) {
            if (!mediaId) {
                renderErrorState("No Media ID was requested.");
                return;
            }

            try {
                const response = await fetch(`/api/media/${encodeURIComponent(mediaId)}`);
                if (!response.ok) throw new Error("Could not fetch media details.");
                
                currentMedia = await response.json();
                renderPage(currentMedia);
                
                loadRecommendations(currentMedia);
            } catch (error) {
                console.error("Details Fetch Failed:", error);
                renderErrorState("Could not fetch details. Please verify your connection.");
            }
        }

        function renderPage(media) {
            const format = (media.format || media.sub_type || '').toUpperCase();
            const isSingleEpisodeOrMovie = format === 'MOVIE' || format === 'OVA' || media.type === 'movie' || !media.episodes || media.episodes.length <= 1;
            const hasEpisodes = !isSingleEpisodeOrMovie && media.episodes && media.episodes.length > 1;
            const isComingSoon = media.type === 'manga';
            const target = document.getElementById('media-content-target');
            const displayType = getDisplayType(media);
            const hasTrailer = media.trailer_url && media.trailer_url.trim() !== "";
            const formattedRuntime = formatRuntime(media.runtime);

            target.innerHTML = `
                <!-- Backdrop Banner -->
                <div class="hero-banner" style="background-image: url('${media.banner_url || media.poster_url || ''}')">
                    <div class="hero-content">
                        <div class="media-logo-wrap">
                            ${media.clear_logo_url 
                                ? `<img class="media-logo" src="${media.clear_logo_url}" alt="${media.title}">`
                                : `<h1 class="fallback-title">${media.title}</h1>`
                            }
                        </div>

                        ${media.tagline ? `<p class="media-tagline">“${media.tagline}”</p>` : ''}

                        <!-- Metadata Row -->
                        <div class="metadata-row">
                            ${media.rating != null ? `
                                <div class="badge badge-star">
                                    <i class="ph-fill ph-star"></i>
                                    <span>${media.rating.toFixed(1)}</span>
                                </div>
                            ` : ''}
                            <span class="badge">${media.release_year || '—'}</span>
                            <span class="badge" style="text-transform: uppercase;">${displayType}</span>
                            ${media.age_rating ? `<span class="badge" style="font-weight: 700;">${media.age_rating}</span>` : ''}
                            ${formattedRuntime ? `<span class="badge">${formattedRuntime}</span>` : ''}
                            ${media.status ? `<span class="badge">${media.status}</span>` : ''}
                            ${media.genres ? media.genres.slice(0, 3).map(g => `<span class="badge">${g}</span>`).join('') : ''}
                        </div>

                        <!-- Action Bar -->
                        <div class="action-bar">
                            <button class="btn-primary btn-tactile${isComingSoon ? ' coming-soon' : ''}"${isComingSoon ? ' disabled aria-disabled="true"' : ` onclick="triggerPlayback()"`}>
                                <i class="${isComingSoon ? 'ph ph-clock' : 'ph-fill ph-play'}"></i>
                                <span>${isComingSoon ? 'Coming soon...' : 'Watch Now'}</span>
                            </button>
                            ${hasTrailer ? `
                                <button class="btn-secondary btn-tactile" onclick="openTrailer('${media.trailer_url}')">
                                    <i class="ph ph-film-strip"></i>
                                    <span>Trailer</span>
                                </button>
                            ` : ''}
                            <button class="btn-icon btn-tactile" onclick="toggleWatchlist('${media.id}')">
                                <i class="ph ph-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>

                ${isComingSoon ? `
                    <div class="info-body-grid">
                        <div class="availability-notice" role="status">
                            <i class="ph ph-info"></i>
                            <span><strong>Manga reading is coming soon.</strong> You can still explore the catalog and view details.</span>
                        </div>
                    </div>
                ` : ''}

                <!-- Info Grid Body -->
                <div class="info-body-grid">
                    <div class="details-split-layout">
                        
                        <!-- Left Main Area -->
                        <div class="main-col">
                            <!-- Synopsis Shelf -->
                            <div class="shelf">
                                <h2 class="shelf-title">Synopsis</h2>
                                <p class="synopsis-text">${media.description || "No overview is currently available for this title."}</p>
                            </div>

                            <!-- Episodes (Only if multi-episode series) -->
                            ${hasEpisodes ? renderEpisodesTemplate(media) : ''}

                            <!-- Cast Shelf -->
                            <div class="shelf">
                                <h2 class="shelf-title">Cast</h2>
                                <div class="shelf-rail">
                                    ${renderCastList(media.cast)}
                                </div>
                            </div>

                            <!-- Recommendations Shelf -->
                            <div class="shelf">
                                <h2 class="shelf-title">More Like This</h2>
                                <div id="recommendations-target" class="shelf-rail">
                                    <div class="skeleton-block shimmer-bg" style="width:140px; height:200px; border-radius:10px;"></div>
                                    <div class="skeleton-block shimmer-bg" style="width:140px; height:200px; border-radius:10px;"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Sidebar Specifications Area -->
                        <div class="sidebar-col">
                            <div class="sidebar-card">
                                ${media.director ? `
                                    <div class="sidebar-section">
                                        <h3 class="sidebar-title">Director</h3>
                                        <div class="sidebar-value">${media.director}</div>
                                    </div>
                                ` : ''}

                                ${media.studios && media.studios.length > 0 ? `
                                    <div class="sidebar-section">
                                        <h3 class="sidebar-title">Studios</h3>
                                        <div>
                                            ${media.studios.map(studio => `<span class="studio-tag">${studio}</span>`).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                <div class="sidebar-section">
                                    <h3 class="sidebar-title">Specs</h3>
                                    <div style="display: grid; grid-template-columns: 100px 1fr; gap: 10px; font-size: 0.82rem; line-height: 1.5;">
                                        <span style="color: var(--text-secondary);">Status</span>
                                        <span>${media.status || '—'}</span>
                                        
                                        <span style="color: var(--text-secondary);">Release Year</span>
                                        <span>${media.release_year || '—'}</span>

                                        ${media.age_rating ? `
                                            <span style="color: var(--text-secondary);">Age Rating</span>
                                            <span>${media.age_rating}</span>
                                        ` : ''}

                                        ${formattedRuntime ? `
                                            <span style="color: var(--text-secondary);">Runtime</span>
                                            <span>${formattedRuntime}</span>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;

            if (hasEpisodes && media.seasons && media.seasons.length > 0) {
                const selector = document.getElementById('season-dropdown');
                if (selector) {
                    selector.addEventListener('change', (e) => {
                        filterEpisodesBySeason(parseInt(e.target.value));
                    });
                    filterEpisodesBySeason(media.seasons[0].season_number);
                } else if (media.episodes && media.episodes.length > 0) {
                    filterEpisodesBySeason(media.episodes[0].season_number);
                }
            }
        }

        function renderEpisodesTemplate(media) {
            const hasMultipleSeasons = media.seasons && media.seasons.length > 1;

            return `
                <div class="episodes-section">
                    <div class="episodes-header-row">
                        <h2 class="shelf-title">Episodes</h2>
                        ${hasMultipleSeasons ? `
                            <select id="season-dropdown" class="season-selector">
                                ${media.seasons.map(s => `
                                    <option value="${s.season_number}">${s.title}</option>
                                `).join('')}
                            </select>
                        ` : ''}
                    </div>
                    <div id="episodes-cards-container" class="episodes-grid">
                        ${media.episodes.map(ep => renderEpisodeCard(ep)).join('')}
                    </div>
                </div>
            `;
        }

        function renderEpisodeCard(ep) {
            const targetMappedId = ep.mapped_id || currentMedia.id;
            const absNum = ep.absolute_number || ep.episode_number || 1;
            return `
                <div class="episode-card" 
                     data-season="${ep.season_number}" 
                     onclick="playEpisode('${targetMappedId}', ${absNum})">
                    <div class="ep-thumb-wrap">
                        <img class="ep-thumb" src="${ep.thumbnail_url || currentMedia.banner_url || ''}" loading="lazy" alt="">
                        <span class="ep-number">EP ${absNum}</span>
                    </div>
                    <div class="ep-card-body">
                        <div class="ep-card-title">${ep.title || `Episode ${absNum}`}</div>
                        <div class="ep-card-desc">${ep.synopsis || 'No synopsis available.'}</div>
                    </div>
                </div>
            `;
        }

        function filterEpisodesBySeason(seasonNum) {
            const cards = document.querySelectorAll('#episodes-cards-container .episode-card');
            cards.forEach(card => {
                const epSeason = parseInt(card.getAttribute('data-season'));
                card.style.display = (epSeason === seasonNum) ? 'block' : 'none';
            });
        }

        function triggerPlayback() {
            if (!currentMedia) return;
            if (currentMedia.episodes && currentMedia.episodes.length > 0) {
                const firstEp = currentMedia.episodes[0];
                playEpisode(firstEp.mapped_id || currentMedia.id, firstEp.absolute_number || 1);
            } else {
                playEpisode(currentMedia.id, 1);
            }
        }

        function playEpisode(mappedId, absoluteNumber) {
            window.parent.postMessage({
                type: 'PLAY_MEDIA',
                mappedId: mappedId,
                episode: absoluteNumber
            }, '*');

            window.location.href = `./view.html?id=${encodeURIComponent(mappedId)}&episode=${absoluteNumber}`;
        }

        /* ── Embedded Cover Lightbox Logic ─────────────────── */
        function getEmbedUrl(url) {
            if (!url) return '';

            const ytRegex = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const ytMatch = url.match(ytRegex);

            if (ytMatch && ytMatch[2].length === 11) {
                return `https://www.youtube.com/embed/${ytMatch[2]}?autoplay=1`;
            }

            const vimeoRegex = /vimeo\.com\/([0-9]+)/;
            const vimeoMatch = url.match(vimeoRegex);
            if (vimeoMatch) {
                return `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1`;
            }

            return url;
        }

        function openTrailer(url) {
            const embedUrl = getEmbedUrl(url);
            if (!embedUrl) return;

            const modal = document.getElementById('trailer-modal');
            const iframe = document.getElementById('trailer-iframe');

            if (modal && iframe) {
                iframe.src = embedUrl;
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('active');
                }, 10);
            }
        }

        function closeTrailer() {
            const modal = document.getElementById('trailer-modal');
            const iframe = document.getElementById('trailer-iframe');

            if (modal && iframe) {
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                    iframe.src = '';
                }, 300);
            }
        }

        function closeTrailerOnOverlay(e) {
            if (e.target.id === 'trailer-modal') {
                closeTrailer();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('trailer-modal');
                if (modal && modal.style.display === 'flex') {
                    closeTrailer();
                }
            }
        });

        function toggleWatchlist(mediaId) {
            window.parent.postMessage({ type: 'WATCHLIST_TOGGLE', id: mediaId }, '*');
        }

        async function loadRecommendations(media) {
            const recTarget = document.getElementById('recommendations-target');
            if (!recTarget) return;

            let list = [];

            if (media.recommendations && media.recommendations.length > 0) {
                list = media.recommendations;
            } else {
                try {
                    const res = await fetch(`/api/discovery?type=${encodeURIComponent(media.type)}&sort=popular`);
                    if (res.ok) {
                        const data = await res.json();
                        list = data.filter(item => item.id !== media.id);
                    }
                } catch (e) {
                    console.error("Recommendations fetch fallback failed:", e);
                }
            }

            const filtered = list.slice(0, 7);

            if (filtered.length === 0) {
                recTarget.innerHTML = `<span style="font-size:0.8rem; color:var(--text-muted);">No recommendations available.</span>`;
                return;
            }

            recTarget.innerHTML = filtered.map(item => `
                <div class="rec-card-wrap" onclick="navigateParentToDetails('${item.id}')">
                    <div class="poster-card">
                        <img class="poster-img" src="${item.poster_url || ''}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="rec-title" title="${item.title}">${item.title}</div>
                </div>
            `).join('');
        }

        function navigateParentToDetails(id) {
            window.parent.postMessage({ type: 'DISCOVER_SELECT', id }, '*');
            window.location.href = `./info.html?id=${encodeURIComponent(id)}`;
        }

        function renderCastList(castArray) {
            if (!castArray || castArray.length === 0) {
                return `<span style="font-size:0.8rem; color:var(--text-muted);">Cast information is not available.</span>`;
            }

            return castArray.map(member => {
                const placeholderAvatar = `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=60`;
                return `
                    <div class="cast-card">
                        <div class="cast-avatar-wrap">
                            <img class="cast-avatar" src="${member.profile_url || placeholderAvatar}" loading="lazy" alt="${member.name}" onerror="this.src='${placeholderAvatar}'">
                        </div>
                        <div class="cast-name" title="${member.name}">${member.name}</div>
                        <div class="cast-role" title="${member.character || ''}">${member.character || 'Cast Member'}</div>
                    </div>
                `;
            }).join('');
        }

        function renderErrorState(message) {
            document.getElementById('media-content-target').innerHTML = `
                <div style="padding: 100px 24px; text-align: center; color: var(--text-secondary);">
                    <i class="ph ph-warning" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 16px;"></i>
                    <p style="font-size: 1rem; font-weight: 500;">${message}</p>
                </div>
            `;
        }

        window.addEventListener('message', ({ data }) => {
            if (data.type === 'LOAD_MEDIA' && data.id) {
                loadMediaDetails(data.id);
            }
        });

        const initialId = getMediaIdParam();
        if (initialId) {
            loadMediaDetails(initialId);
        }
    </script>
</body>
</html>
