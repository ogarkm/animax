<!-- --- view.html --- -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Console</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../static/phosphor.js"></script>
    <style>
        :root {
            --accent: var(--brand, #8FE7EC);
            --accent-dim: var(--brand-dim, rgba(143, 231, 236, 0.15));
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            background: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
        }

        /* ── Modernized Ambient Underlay (Soft, Cinematic Blur) ── */
        .ambient-background {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(0.32); /* Reduced blur to preserve high-end artistic shapes */
            transform: scale(1.1); /* Prevents edge leaks */
            z-index: 1;
            transition: background-image 0.8s var(--ease-out-expo);
        }

        /* ── Bottom scrim for legibility of bottom-left content ── */
        .bottom-scrim {
            position: absolute;
            inset: auto 0 0 0;
            height: 52vh;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.55) 35%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ── Bottom-Left Info Panel (title + synopsis) ─────────── */
        .bottom-info-panel {
            position: absolute;
            left: max(4vw, 32px);
            bottom: max(6vh, 40px);
            right: max(4vw, 32px);
            z-index: 3;
            max-width: min(46vw, 520px);
            text-align: left;
            transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
        }

        .bottom-info-panel.resolved {
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
        }

        .media-branding {
            max-width: min(60vw, 340px);
            margin-bottom: 16px;
        }

        .media-logo {
            max-height: 84px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
        }

        .fallback-title {
            font-size: clamp(1.5rem, 3.4vw, 2.25rem);
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .episode-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .episode-synopsis {
            font-size: 0.875rem;
            line-height: 1.55;
            color: var(--text-secondary, #C7C7CC);
            max-width: 520px;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* ── Clean Minimalist Atomic Loader ───────────────────── */
        .center-loader-wrap {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
        }

        .center-loader-wrap.resolved {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.95);
            pointer-events: none;
        }

        .atomic-visualizer {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Extremely subtle backdrop glow */
        .atomic-ambient-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Clean core nucleus with subtle transform animations */
        .atomic-nucleus {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            z-index: 10;
            animation: nucleus-breathe 2.5s ease-in-out infinite;
        }

        /* Mathematical 3D Orbit planes */
        .atomic-orbits {
            position: absolute;
            width: 100px;
            height: 100px;
            perspective: 800px;
            transform-style: preserve-3d;
            z-index: 5;
        }

        .orbit-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Elegant geometric tilts */
        .orbit-plane.axis-1 { transform: rotateX(68deg) rotateY(-20deg); }
        .orbit-plane.axis-2 { transform: rotateX(68deg) rotateY(40deg); }
        .orbit-plane.axis-3 { transform: rotateX(0deg) rotateY(78deg); }

        .orbit-track {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* Independent speeds to ensure varied alignment profiles */
        .orbit-plane.axis-1 .orbit-track { animation: orbit-spin-cw 3.2s linear infinite; }
        .orbit-plane.axis-2 .orbit-track { animation: orbit-spin-ccw 2.4s linear infinite; }
        .orbit-plane.axis-3 .orbit-track { animation: orbit-spin-cw 1.8s linear infinite; }

        /* Crisp, tiny electron points */
        .electron {
            position: absolute;
            top: 50%;
            left: 0;
            width: 3.5px;
            height: 3.5px;
            background: #ffffff;
            border-radius: 50%;
            margin-top: -1.75px;
            margin-left: -1.75px;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }

        /* Premium, lightweight status text styling */
        .loader-status-text {
            margin-top: 16px;
            font-size: 0.813rem; /* 13px */
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.03em;
            text-align: center;
        }

        /* Canvas cloud for anti-aliased floating dust elements */
        #particle-cloud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* ── Embedded Frame Viewport ────────────────────────── */
        .player-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo);
        }

        .player-viewport.active {
            opacity: 1;
            transform: scale(1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }

        /* ── Back Navigation Control ────────────────────────── */
        .back-nav-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(12px);
            transition: all 0.2s var(--ease-out-expo);
        }

        .back-nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* ── Error State (rendered in the center loader slot) ──── */
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: max(60vw, 280px);
        }

        .error-state .error-icon {
            color: var(--accent);
            font-size: 2.75rem;
            margin-bottom: 14px;
        }

        .error-state h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .error-state p {
            font-size: 0.875rem;
            color: var(--text-secondary, #8E8E93);
            margin: 0 0 22px;
        }

        /* ── Keyframes ──────────────────────────────────────── */
        @keyframes nucleus-breathe {
            0%, 100% { transform: scale(0.9); box-shadow: 0 0 6px rgba(255, 255, 255, 0.5); }
            50% { transform: scale(1.15); box-shadow: 0 0 12px rgba(255, 255, 255, 0.85); }
        }

        @keyframes orbit-spin-cw {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        @keyframes orbit-spin-ccw {
            0% { transform: rotateZ(360deg); }
            100% { transform: rotateZ(0deg); }
        }
    </style>
</head>
<body>

    <!-- Back Control -->
    <button class="back-nav-btn btn-tactile" onclick="returnToDetails()" aria-label="Go back">
        <i class="ph ph-arrow-left"></i>
    </button>

    <!-- Deep Ambient Vignette Background -->
    <div id="ambient-bg-underlay" class="ambient-background"></div>

    <!-- Bottom scrim for text legibility -->
    <div class="bottom-scrim"></div>

    <!-- Bottom-Left Title + Synopsis Panel -->
    <div id="bottom-info-panel" class="bottom-info-panel">
        <div class="media-branding">
            <div id="branding-target">
                <!-- Loaded dynamically -->
            </div>
        </div>

        <div id="episode-info-target">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <!-- Centered Atomic Core Loader -->
    <div id="center-loader" class="center-loader-wrap">
        <div class="atomic-visualizer">
            <!-- Canvas cloud for organic micro-probability particles -->
            <canvas id="particle-cloud" width="130" height="130"></canvas>
            <div class="atomic-ambient-glow"></div>
            <div class="atomic-nucleus"></div>

            <div class="atomic-orbits">
                <div class="orbit-plane axis-1">
                    <div class="orbit-track"><div class="electron"></div></div>
                </div>
                <div class="orbit-plane axis-2">
                    <div class="orbit-track"><div class="electron"></div></div>
                </div>
                <div class="orbit-plane axis-3">
                    <div class="orbit-track"><div class="electron"></div></div>
                </div>
            </div>
        </div>
        <div class="loader-status-text" id="loader-status">Connecting to stream...</div>
    </div>

    <!-- Active Media Display Surface -->
    <div id="player-frame-wrapper" class="player-viewport">
        <!-- Iframe loaded on source resolution -->
        <iframe id="playback-iframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        let currentMediaId = null;
        let currentEpisodeNum = null;

        // ── Pull parameters from search query strings ────────────
        function resolveQueryParams() {
            const params = new URLSearchParams(window.location.search);
            currentMediaId = params.get('id') || params.get('media_id');
            currentEpisodeNum = parseInt(params.get('episode') || params.get('ep') || '1');
        }

        // ── Direct Channel back-navigation callback ──────────────
        function returnToDetails() {
            if (currentMediaId) {
                // Return to info view frame
                window.location.href = `./info.html?id=${currentMediaId}`;
            } else {
                window.parent.postMessage({ type: 'CLOSE_PLAYER' }, '*');
            }
        }

        // ── Initialize Console metadata fetching sequences ──────
        async function fetchConsoleMetadata() {
            if (!currentMediaId) return;

            try {
                const res = await fetch(`/api/media/${encodeURIComponent(currentMediaId)}`);
                if (!res.ok) throw new Error();
                const media = await res.json();

                updateConsoleUI(media);
            } catch (err) {
                console.error("Failed to load layout console details:", err);
            }
        }

        // ── Apply contextual layout states based on database data ──
        function updateConsoleUI(media) {
            const isMovie = media.type === 'movie' || media.id.startsWith('tm');
            const ambientBg = document.getElementById('ambient-bg-underlay');
            const brandingTarget = document.getElementById('branding-target');
            const infoTarget = document.getElementById('episode-info-target');

            let banner = media.banner_url || media.poster_url || '';
            let labelText = '';
            let synopsisText = media.description || '';

            // Handle series metadata details
            if (!isMovie && media.episodes && media.episodes.length > 0) {
                // Find episode metadata matching requested sequence number
                const ep = media.episodes.find(e => e.absolute_number === currentEpisodeNum) || media.episodes[0];
                if (ep) {
                    banner = ep.thumbnail_url || banner;
                    labelText = `Episode ${ep.episode_number}: ${ep.title}`;
                    synopsisText = ep.synopsis || synopsisText;
                }
            }

            // Set ambient background image
            if (banner) {
                ambientBg.style.backgroundImage = `url('${banner}')`;
            }

            // Set Title/Branding
            brandingTarget.innerHTML = media.clear_logo_url
                ? `<img class="media-logo" src="${media.clear_logo_url}" alt="${media.title}">`
                : `<h1 class="fallback-title">${media.title}</h1>`;

            // Set Info metadata
            infoTarget.innerHTML = `
                ${labelText ? `<div class="episode-label">${labelText}</div>` : ''}
                <p class="episode-synopsis">${synopsisText}</p>
            `;
        }

        // ── Fire parallel backend resolution scraper call ──────────
        async function resolvePlaybackSources() {
            try {
                const res = await fetch(`/api/sources/${encodeURIComponent(currentMediaId)}?episode=${currentEpisodeNum}`);
                if (!res.ok) throw new Error("Could not fetch target source offers.");

                const offers = await res.json();
                if (!offers || offers.length === 0) {
                    throw new Error("No available streaming sources found.");
                }

                // Pick best offer (Defaulting to the first available)
                const selectedOffer = offers[0];

                // Select external player URL microservice if mapped, otherwise fall back to internal
                const targetStreamUrl = selectedOffer.external_player_url || selectedOffer.url;

                initializeIframeStream(targetStreamUrl);
            } catch (err) {
                console.error("Source Resolution Failed:", err);
                displayErrorState(err.message || "An issue occurred while compiling stream links.");
            }
        }

        // ── Transition interface elements and mount iframe ─────
        function initializeIframeStream(streamUrl) {
            const centerLoader = document.getElementById('center-loader');
            const infoPanel = document.getElementById('bottom-info-panel');
            const viewport = document.getElementById('player-frame-wrapper');
            const iframe = document.getElementById('playback-iframe');

            // Set target stream URL source
            iframe.src = streamUrl;

            // Wait for iframe content load before completing page transition
            iframe.onload = () => {
                centerLoader.classList.add('resolved');
                infoPanel.classList.add('resolved');
                viewport.classList.add('active');
            };
        }

        function displayErrorState(message) {
            const centerLoader = document.getElementById('center-loader');
            centerLoader.classList.remove('resolved');
            centerLoader.innerHTML = `
                <div class="error-state">
                    <div class="error-icon"><i class="ph ph-warning-circle"></i></div>
                    <h2>Playback Failed</h2>
                    <p>${message}</p>
                    <button class="btn-secondary btn-tactile" onclick="returnToDetails()">
                        <i class="ph ph-arrow-left"></i>
                        <span>Go Back</span>
                    </button>
                </div>
            `;
        }

        /* =========================================================================
           3. FLOATING MICRO-PROBABILITY ENGINE (Canvas Particles)
           Renders soft-edged, fading quantum cloud dust on high-DPI screens.
           ========================================================================= */
        function initAtomicCanvas() {
            const canvas = document.getElementById('particle-cloud');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const size = 130;
            const center = size / 2;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            ctx.scale(dpr, dpr);

            const particles = [];
            const maxParticles = 18;

            class SoftParticle {
                constructor() {
                    this.reset();
                }
                reset() {
                    const angle = Math.random() * Math.PI * 2;
                    const u1 = Math.random();
                    const u2 = Math.random();
                    const normalDist = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);
                    const distance = Math.abs(normalDist) * 18 + 2;

                    this.x = center + Math.cos(angle) * distance;
                    this.y = center + Math.sin(angle) * distance;
                    
                    // Tiny floating drift vector values
                    this.vx = (Math.random() - 0.5) * 0.08;
                    this.vy = (Math.random() - 0.5) * 0.08;

                    this.size = Math.random() * 1.2 + 0.6;
                    this.alpha = 0;
                    this.maxAlpha = Math.random() * 0.4 + 0.1;
                    this.speed = Math.random() * 0.012 + 0.004;
                    this.state = 'in';
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.state === 'in') {
                        this.alpha += this.speed;
                        if (this.alpha >= this.maxAlpha) {
                            this.alpha = this.maxAlpha;
                            this.state = 'out';
                        }
                    } else {
                        this.alpha -= this.speed;
                        if (this.alpha <= 0) {
                            this.reset();
                        }
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < maxParticles; i++) {
                particles.push(new SoftParticle());
                particles[i].alpha = Math.random() * particles[i].maxAlpha;
                if (Math.random() > 0.5) particles[i].state = 'out';
            }

            function draw() {
                if (!document.getElementById('particle-cloud')) return;
                ctx.clearRect(0, 0, size, size);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        /* =========================================================================
           4. SMOOTH TELEMETRY LABELS
           Cycles natural, clear status feedback phases.
           ========================================================================= */
        function initLoaderStatusLoop() {
            const statusEl = document.getElementById('loader-status');
            const phrases = [
                "Connecting to stream...",
                "Resolving playback paths...",
                "Optimizing bandwidth buffers...",
                "Verifying structural streams..."
            ];
            let idx = 0;

            const interval = setInterval(() => {
                if (!statusEl) { clearInterval(interval); return; }
                idx = (idx + 1) % phrases.length;
                statusEl.innerText = phrases[idx];
            }, 3000);
        }

        // Initialize script logic
        resolveQueryParams();
        fetchConsoleMetadata();
        resolvePlaybackSources();
        initAtomicCanvas();
        initLoaderStatusLoop();
    </script>
</body>
</html>
