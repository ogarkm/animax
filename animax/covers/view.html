<!-- --- view.html --- -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Console</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../static/phosphor.js"></script>
    <style>
        :root {
            --accent: var(--brand, #8FE7EC);
            --accent-dim: var(--brand-dim, rgba(143, 231, 236, 0.15));
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            background: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
        }

        /* ── Modernized Ambient Underlay (Soft, Cinematic Blur) ── */
        .ambient-background {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(0.32);
            transform: scale(1.1);
            z-index: 1;
            transition: background-image 0.8s var(--ease-out-expo);
        }

        /* ── Bottom scrim for legibility of bottom-left content ── */
        .bottom-scrim {
            position: absolute;
            inset: auto 0 0 0;
            height: 52vh;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.55) 35%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ── Bottom-Left Info Panel (synopsis) ─────────── */
        .bottom-info-panel {
            position: absolute;
            left: max(4vw, 32px);
            bottom: max(6vh, 40px);
            right: max(4vw, 32px);
            z-index: 3;
            max-width: min(46vw, 520px);
            text-align: left;
            transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
        }

        .bottom-info-panel.resolved {
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
        }

        .episode-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .episode-synopsis {
            font-size: 0.875rem;
            line-height: 1.55;
            color: var(--text-secondary, #C7C7CC);
            max-width: 520px;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* ── Center Loading Wrap ───────────────────── */
        .center-loader-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
            width: 100%;
            pointer-events: none;
        }

        .center-loader-wrap.resolved {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* ── Linear Logo Wipe Elements ───────────────── */
        .center-logo-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .media-logo {
            max-height: 120px;
            max-width: min(60vw, 400px);
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.5));
        }

        .fallback-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            text-align: center;
        }

        /* Base element at 10% transparency */
        .logo-base {
            opacity: 0.1;
            filter: grayscale(100%);
        }

        /* Fully visible wipe layer acting as a sweep */
        .logo-wipe {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Sharp, invisible line wipe gradient */
            -webkit-mask-image: linear-gradient(90deg, 
                transparent 0%, 
                transparent 33%, 
                black 34%, 
                black 66%, 
                transparent 67%, 
                transparent 100%
            );
            mask-image: linear-gradient(90deg, 
                transparent 0%, 
                transparent 33%, 
                black 34%, 
                black 66%, 
                transparent 67%, 
                transparent 100%
            );
            -webkit-mask-size: 300% 100%;
            mask-size: 300% 100%;
            animation: linear-wipe-sweep 3s cubic-bezier(0.7, 0, 0.3, 1) infinite;
        }

        @keyframes linear-wipe-sweep {
            0% { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
            30% { -webkit-mask-position: 50% 0; mask-position: 50% 0; }  /* Sweeps left to right revealing 100% */
            70% { -webkit-mask-position: 50% 0; mask-position: 50% 0; }  /* Holds visually complete */
            100% { -webkit-mask-position: 0% 0; mask-position: 0% 0; }   /* Sweeps out right vanishing smoothly */
        }

        /* Premium, lightweight status text styling */
        .loader-status-text {
            font-size: 0.813rem; /* 13px */
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.03em;
            text-align: center;
            text-transform: uppercase;
        }

        /* ── Embedded Frame Viewport ────────────────────────── */
        .player-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo);
        }

        .player-viewport.active {
            opacity: 1;
            transform: scale(1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000000;
        }

        /* ── Back Navigation Control ────────────────────────── */
        .back-nav-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(12px);
            transition: all 0.2s var(--ease-out-expo);
        }

        .back-nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* ── Modernized Error State ────────────────────────── */
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: max(60vw, 280px);
            pointer-events: auto; /* Re-enable pointer events for the button */
        }

        .error-state .error-icon {
            color: #ff453a;
            font-size: 3.5rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 12px rgba(255, 69, 58, 0.4));
        }

        .error-state h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .error-state p {
            font-size: 0.9rem;
            color: var(--text-secondary, #8E8E93);
            margin: 0 0 24px;
        }

        .error-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.25s var(--ease-out-expo);
        }

        .error-action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .error-action-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Back Control -->
    <button class="back-nav-btn btn-tactile" onclick="returnToDetails()" aria-label="Go back">
        <i class="ph ph-arrow-left"></i>
    </button>

    <!-- Deep Ambient Vignette Background -->
    <div id="ambient-bg-underlay" class="ambient-background"></div>

    <!-- Bottom scrim for text legibility -->
    <div class="bottom-scrim"></div>

    <!-- Bottom-Left Synopsis Panel -->
    <div id="bottom-info-panel" class="bottom-info-panel">
        <div id="episode-info-target">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <!-- Centered Logo Linear Wipe Loader -->
    <div id="center-loader" class="center-loader-wrap">
        <div id="center-logo-target" class="center-logo-container">
            <!-- Populated via API data -->
        </div>
        <div class="loader-status-text" id="loader-status">Connecting to stream...</div>
    </div>

    <!-- Active Media Display Surface -->
    <div id="player-frame-wrapper" class="player-viewport">
        <iframe id="playback-iframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        let currentMediaId = null;
        let currentEpisodeNum = null;

        // ── Pull parameters from search query strings ────────────
        function resolveQueryParams() {
            const params = new URLSearchParams(window.location.search);
            currentMediaId = params.get('id') || params.get('media_id');
            currentEpisodeNum = parseInt(params.get('episode') || params.get('ep') || '1');
        }

        // ── Direct Channel back-navigation callback ──────────────
        function returnToDetails() {
            if (currentMediaId) {
                // Return to info view frame
                window.location.href = `./info.html?id=${currentMediaId}`;
            } else {
                window.parent.postMessage({ type: 'CLOSE_PLAYER' }, '*');
            }
        }

        // ── Initialize Console metadata fetching sequences ──────
        async function fetchConsoleMetadata() {
            if (!currentMediaId) return;

            try {
                const res = await fetch(`/api/media/${encodeURIComponent(currentMediaId)}`);
                if (!res.ok) throw new Error();
                const media = await res.json();

                updateConsoleUI(media);
            } catch (err) {
                console.error("Failed to load layout console details:", err);
            }
        }

        // ── Apply contextual layout states based on database data ──
        function updateConsoleUI(media) {
            const isMovie = media.type === 'movie' || media.id.startsWith('tm');
            const ambientBg = document.getElementById('ambient-bg-underlay');
            const infoTarget = document.getElementById('episode-info-target');
            const centerLogoTarget = document.getElementById('center-logo-target');

            let banner = media.banner_url || media.poster_url || '';
            let labelText = '';
            let synopsisText = media.description || '';

            // Handle series metadata details
            if (!isMovie && media.episodes && media.episodes.length > 0) {
                const ep = media.episodes.find(e => e.absolute_number === currentEpisodeNum) || media.episodes[0];
                if (ep) {
                    banner = ep.thumbnail_url || banner;
                    labelText = `Episode ${ep.episode_number}: ${ep.title}`;
                    synopsisText = ep.synopsis || synopsisText;
                }
            }

            // Set ambient background image
            if (banner) {
                ambientBg.style.backgroundImage = `url('${banner}')`;
            }

            // Build dynamic branding markup for the center wipe loader
            const logoHTML = media.clear_logo_url
                ? `<img class="media-logo" src="${media.clear_logo_url}" alt="${media.title}">`
                : `<h1 class="fallback-title">${media.title}</h1>`;

            centerLogoTarget.innerHTML = `
                <div class="logo-base">${logoHTML}</div>
                <div class="logo-wipe">${logoHTML}</div>
            `;

            // Set Info metadata (bottom-left)
            infoTarget.innerHTML = `
                ${labelText ? `<div class="episode-label">${labelText}</div>` : ''}
                <p class="episode-synopsis">${synopsisText}</p>
            `;
        }

        // ── Fire parallel backend resolution scraper call ──────────
        let availableOffers = [];
        let currentOfferIndex = 0;

        // Persisted SUB/DUB preference — same key/logic as player.html so a
        // choice made in the player's Sources menu carries over here too
        // (shared localStorage, same origin) and to future episode loads.
        const DUB_PREF_KEY = 'animax_preferred_dub';
        function getPreferredDub() {
            try {
                const v = localStorage.getItem(DUB_PREF_KEY);
                return v === null ? null : v === 'true';
            } catch (e) { return null; }
        }
        function pickOfferIndexByPreference(offers) {
            const pref = getPreferredDub();
            if (pref === null || !Array.isArray(offers)) return 0;
            const idx = offers.findIndex(o => !!o.dub === pref);
            return idx >= 0 ? idx : 0;
        }

        async function resolvePlaybackSources() {
            try {
                const res = await fetch(`/api/sources/${encodeURIComponent(currentMediaId)}?episode=${currentEpisodeNum}`);
                if (!res.ok) throw new Error("Could not fetch target source offers.");

                availableOffers = await res.json();
                if (!availableOffers || availableOffers.length === 0) {
                    throw new Error("No available streaming sources found.");
                }

                currentOfferIndex = pickOfferIndexByPreference(availableOffers);
                loadOffer(currentOfferIndex);
            } catch (err) {
                console.error("Source Resolution Failed:", err);
                displayErrorState(err.message || "An issue occurred while compiling stream links.");
            }
        }

        function loadOffer(index) {
            if (!availableOffers || index < 0 || index >= availableOffers.length) return;
            currentOfferIndex = index;
            const selectedOffer = availableOffers[index];
            let targetStreamUrl = selectedOffer.external_player_url || selectedOffer.url;

            // Format all available provider offers into player.html menu payload
            const formattedSources = availableOffers.map((offer, idx) => ({
                id: `offer-${idx}-${offer.provider}`,
                provider: (offer.provider || 'Provider').toUpperCase(),
                server: `${(offer.provider || 'Server').toUpperCase()} (${offer.dub ? 'DUB' : 'SUB'})`,
                quality: offer.quality || 'Auto',
                title: `${offer.provider} ${offer.dub ? 'Dub' : 'Sub'}`,
                type: offer.type,
                dub: !!offer.dub,
                url: offer.external_player_url || offer.url
            }));

            const sourcesPayload = encodeURIComponent(JSON.stringify(formattedSources));
            const separator = targetStreamUrl.includes('?') ? '&' : '?';
            targetStreamUrl = `${targetStreamUrl}${separator}stream_sources=${sourcesPayload}`;

            initializeIframeStream(targetStreamUrl);
        }

        // Handle provider switch and episode change requests from child iframe
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.type === 'SWITCH_PROVIDER' || event.data.type === 'TRY_NEXT_PROVIDER') {
                if (availableOffers.length > 1) {
                    const nextIdx = (currentOfferIndex + 1) % availableOffers.length;
                    loadOffer(nextIdx);
                }
            } else if (event.data.type === 'EPISODE_CHANGED') {
                const ep = event.data;
                // Gracefully update browser URL parameters without reloading page
                const currentUrl = new URL(window.location.href);
                if (ep.episode) currentUrl.searchParams.set('episode', ep.episode);
                if (ep.season) currentUrl.searchParams.set('season', ep.season);
                // Anime seasons can map to a different underlying id (AniList
                // season-chain stitching in discovery.py), so keep the URL's
                // id in sync too — otherwise a refresh mid-binge reloads the
                // wrong season.
                if (ep.mapped_id) currentUrl.searchParams.set('id', ep.mapped_id);
                window.history.replaceState({}, '', currentUrl.toString());
                if (ep.mapped_id) currentMediaId = ep.mapped_id;
                if (ep.episode) currentEpisodeNum = ep.episode;

                // Update info panel metadata, synopsis, and ambient backdrop —
                // same elements/pattern as updateConsoleUI() uses on initial load.
                const infoTarget = document.getElementById('episode-info-target');
                if (infoTarget) {
                    const labelText = ep.episode ? `Episode ${ep.episode}: ${ep.title || ''}` : '';
                    infoTarget.innerHTML = `
                        ${labelText ? `<div class="episode-label">${labelText}</div>` : ''}
                        <p class="episode-synopsis">${ep.synopsis || ''}</p>
                    `;
                }
                if (ep.thumbnail_url) {
                    const ambientBg = document.getElementById('ambient-bg-underlay');
                    if (ambientBg) ambientBg.style.backgroundImage = `url('${ep.thumbnail_url}')`;
                }
            }
        });

        // ── Transition interface elements and mount iframe ─────
        function initializeIframeStream(streamUrl) {
            const centerLoader = document.getElementById('center-loader');
            const infoPanel = document.getElementById('bottom-info-panel');
            const viewport = document.getElementById('player-frame-wrapper');
            const iframe = document.getElementById('playback-iframe');

            // Set target stream URL source
            iframe.src = streamUrl;

            // Wait for iframe content load before completing page transition
            iframe.onload = () => {
                centerLoader.classList.add('resolved');
                infoPanel.classList.add('resolved');
                viewport.classList.add('active');
            };
        }

        // ── Render Error Interface with Modern Action Styles ────
        function displayErrorState(message) {
            const centerLoader = document.getElementById('center-loader');
            centerLoader.classList.remove('resolved');
            
            centerLoader.innerHTML = `
                <div class="error-state">
                    <div class="error-icon"><i class="ph-fill ph-warning-circle"></i></div>
                    <h2>Playback Failed</h2>
                    <p>${message}</p>
                    <button class="error-action-btn" onclick="returnToDetails()">
                        <i class="ph ph-arrow-left"></i>
                        <span>Return to Details</span>
                    </button>
                </div>
            `;
        }

        // ── SMOOTH TELEMETRY LABELS ─────────────────────────────
        function initLoaderStatusLoop() {
            const statusEl = document.getElementById('loader-status');
            const phrases = [
                "Connecting to stream...",
                "Resolving playback paths...",
                "Optimizing bandwidth buffers...",
                "Verifying structural streams..."
            ];
            let idx = 0;

            const interval = setInterval(() => {
                if (!document.body.contains(statusEl)) { 
                    clearInterval(interval); 
                    return; 
                }
                idx = (idx + 1) % phrases.length;
                statusEl.innerText = phrases[idx];
            }, 3500);
        }

        // Initialize scripts
        resolveQueryParams();
        fetchConsoleMetadata();
        resolvePlaybackSources();
        initLoaderStatusLoop();
    </script>
</body>
</html>
