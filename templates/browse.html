<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenPlayer Browser</title>
    
    <!-- Modern Premium Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #060608;
            --surface: rgba(20, 20, 25, 0.45);
            --surface-heavy: rgba(10, 10, 12, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-hover: rgba(255, 255, 255, 0.16);
            --brand-primary: #ffffff; 
            --brand-secondary: #a3a3a3;
            --brand-glow: rgba(255, 255, 255, 0.25);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --live-red: #ef4444;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg); 
            color: var(--text); 
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow {
            position: absolute;
            top: -150px;
            left: 10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Navbar with Glassmorphism */
        nav {
            position: sticky; 
            top: 0; 
            z-index: 100;
            background: rgba(6, 6, 8, 0.75); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
        }
        
        .logo { 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            color: white; 
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span { 
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.6);
            color: transparent;
        }
        
        .controls { 
            display: flex; 
            gap: 16px; 
            align-items: center; 
        }
        
        input[type="text"] {
            background: var(--surface); 
            border: 1px solid var(--border-glass);
            color: white; 
            padding: 10px 18px; 
            border-radius: 999px; 
            outline: none; 
            width: 280px;
            font-family: inherit;
            font-size: 0.85rem;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]:focus { 
            border-color: var(--border-glass-hover); 
            background: rgba(20, 20, 25, 0.7);
        }
        
        .filter-select {
            background: var(--surface); 
            color: white; 
            border: 1px solid var(--border-glass);
            padding: 10px 16px; 
            border-radius: 999px; 
            outline: none; 
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }
        .filter-select:hover {
            border-color: var(--border-glass-hover);
        }
        
        .toggle-live {
            display: flex; 
            align-items: center; 
            gap: 10px; 
            cursor: pointer; 
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            user-select: none;
            background: var(--surface);
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--border-glass);
            transition: border-color 0.2s, background 0.2s;
        }
        .toggle-live:hover {
            border-color: var(--border-glass-hover);
        }
        .dot { 
            height: 8px; 
            width: 8px; 
            background: var(--brand-secondary); 
            border-radius: 50%; 
            transition: 0.3s; 
        }
        .toggle-live.active .dot { 
            background: var(--live-red); 
            box-shadow: 0 0 8px var(--live-red); 
            animation: live-pulse-red 1.6s infinite;
        }
        @keyframes live-pulse-red {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.9); }
        }

        /* Container & Hero Section */
        .container { 
            position: relative;
            padding: 40px; 
            max-width: 1600px; 
            margin: 0 auto; 
            z-index: 1;
        }

        /* Netflix-style Hero Banner */
        .hero {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-glass);
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .hero-img {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            object-fit: cover;
            mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            z-index: 1;
            opacity: 0.85;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            width: 50%;
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .hero-badge {
            align-self: flex-start;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--live-red);
            color: var(--live-red);
            padding: 4px 12px;
            border-radius: 999px;
            text-transform: uppercase;
        }
        .hero-title {
            font-size: clamp(1.8rem, 3vw, 2.8rem);
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        .hero-desc {
            font-size: 0.95rem;
            color: var(--brand-secondary);
            line-height: 1.6;
            max-width: 500px;
        }
        .hero-btn {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--brand-primary);
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .hero-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
        }
        .hero-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Generic Layout Grids */
        .section-title { 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem; 
            font-weight: 700; 
            margin-bottom: 24px; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--border-glass);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px; 
            margin-bottom: 56px;
        }

        /* Premium Card Design with Glassmorphism */
        .card {
            background: var(--surface); 
            border-radius: 16px; 
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s; 
            cursor: pointer;
            position: relative; 
            border: 1px solid var(--border-glass);
            display: flex; 
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card:hover {
            transform: translateY(-6px); 
            border-color: var(--border-glass-hover);
            box-shadow: 0 16px 36px rgba(0,0,0,0.65);
        }
        .card-img-container {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: #09090b;
        }
        .card-img {
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover .card-img {
            transform: scale(1.05);
        }
        .card-body { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
            gap: 12px;
        }
        .card-title { 
            font-size: 1.05rem; 
            font-weight: 700; 
            line-height: 1.4; 
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta { 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem; 
            color: var(--brand-secondary); 
            display: flex; 
            justify-content: space-between; 
            margin-top: auto; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .badge-live {
            position: absolute; 
            top: 12px; 
            right: 12px; 
            background: var(--live-red);
            color: white; 
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px; 
            font-weight: bold; 
            padding: 4px 10px;
            border-radius: 999px; 
            letter-spacing: 1px; 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.45);
            z-index: 2;
        }

        /* Loading & Error States */
        .loading { 
            text-align: center; 
            color: var(--brand-secondary); 
            padding: 80px; 
            font-size: 1.1rem; 
            font-weight: 500;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 1.5px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid var(--brand-primary);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        @media (max-width: 900px) {
            nav { padding: 16px 20px; flex-direction: column; gap: 16px; }
            .controls { width: 100%; justify-content: space-between; gap: 10px; }
            input[type="text"] { width: 100%; }
            .hero { height: auto; flex-direction: column-reverse; }
            .hero-img { position: relative; width: 100%; height: 220px; mask-image: none; -webkit-mask-image: none; }
            .hero-content { width: 100%; padding: 24px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<nav>
    <a href="/player/browse" class="logo">OPEN<span>PLAYER</span></a>
    <div class="controls">
        <div class="toggle-live" id="liveToggle">
            <div class="dot" id="liveDot"></div> LIVE NOW
        </div>
        <select class="filter-select" id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="sports">Live Sports</option>
            <option value="channels">24/7 Channels</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search events, channels, leagues...">
    </div>
</nav>

<div class="container">
    <!-- Premium Featured Hero Banner -->
    <div id="featuredArea"></div>

    <!-- Active Grid Sections -->
    <div id="contentArea">
        <div class="loading">
            <div class="spinner"></div>
            Fetching Live Catalog...
        </div>
    </div>
</div>

<script>
    let allData = [];
    const featuredArea = document.getElementById('featuredArea');
    const contentArea = document.getElementById('contentArea');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const liveToggle = document.getElementById('liveToggle');
    
    let isLiveOnly = false;

    async function loadData() {
        try {
            // Concurrent fetch requests to local API endpoints
            const [streamsRes, matchesRes] = await Promise.all([
                fetch('/streams').catch(() => ({ json: () => ({ streams: [] }) })),
                fetch('/sports/matches/all').catch(() => ({ json: () => [] }))
            ]);

            const streamsData = await streamsRes.json();
            const matchesData = await matchesRes.json();

            // Normalize Live TV Channels
            const channels = (streamsData.streams || []).map(s => {
                const streamUrl = s.stream_url || s.url || '';
                const sourceList = streamUrl ? [{ id: s.id, title: s.name || 'Stream', type: 'live', url: streamUrl, is_default: true }] : [];
                
                const title = s.name || 'Untitled Channel';
                const synopsis = `Live 24/7 TV transmission for ${title}. Powered by OpenPlayer HLS Engine.`;
                const poster = s.logo || 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=600';
                
                // Deep Integration: Pass metadata in queries to populate player pause overlays immediately
                const launchUrl = streamUrl ? `/player/live?stream_url=${encodeURIComponent(streamUrl)}&stream_sources=${encodeURIComponent(JSON.stringify(sourceList))}&title=${encodeURIComponent(title)}&logo=${encodeURIComponent(poster)}&synopsis=${encodeURIComponent(synopsis)}` : '/player/browse';

                return {
                    id: s.id,
                    title: title,
                    poster: poster,
                    category: s.category || 'channels',
                    type: 'channels',
                    isLive: true,
                    synopsis: synopsis,
                    link: launchUrl
                };
            });

            // Normalize Live Sports Matches
            const matches = matchesData.map(m => {
                const sourceList = Array.isArray(m.streams) ? m.streams.map((src, idx) => ({
                    id: src.id || `${m.id}-${idx}`,
                    title: src.source || `Source ${idx + 1}`,
                    type: src.is_direct ? 'direct' : 'live',
                    url: src.url || src.stream_url || '',
                    is_default: idx === 0,
                })).filter(src => src.url) : [];
                
                const streamUrl = (sourceList[0] && sourceList[0].url) || m.stream_url || '';
                const title = m.title || `${m.teams?.home || 'Home'} vs ${m.teams?.away || 'Away'}`;
                const matchLeague = m.league || 'Sports Event';
                const synopsis = `Live match streaming of ${title}. Streaming live from ${matchLeague}. Powered by OpenPlayer HLS Engine.`;
                const poster = m.poster || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&q=80&w=600';

                // Deep Integration: Pass metadata in queries to populate player pause overlays immediately
                const launchUrl = streamUrl ? `/player/live?stream_url=${encodeURIComponent(streamUrl)}&stream_sources=${encodeURIComponent(JSON.stringify(sourceList))}&title=${encodeURIComponent(title)}&logo=${encodeURIComponent(poster)}&synopsis=${encodeURIComponent(synopsis)}` : '/player/browse';

                return {
                    id: m.id,
                    title: title,
                    poster: poster,
                    category: m.sport || 'sports',
                    type: 'sports',
                    isLive: m.status === 'in_progress' || String(m.minute).includes("'") || m.status === 'live',
                    statusText: m.minute ? `${m.minute}'` : (m.status === 'in_progress' ? 'LIVE' : m.status),
                    synopsis: synopsis,
                    link: launchUrl
                };
            });

            allData = [...matches, ...channels];
            
            renderHero();
            renderGrids();
        } catch (e) {
            console.error(e);
            contentArea.innerHTML = `<div class="loading">Error parsing live stream directory.</div>`;
        }
    }

    function renderHero() {
        // Find a high priority live match or fall back to an active channel
        const featuredItem = allData.find(item => item.type === 'sports' && item.isLive) || allData[0];
        
        if (!featuredItem) {
            featuredArea.innerHTML = '';
            return;
        }

        featuredArea.innerHTML = `
            <div class="hero">
                <img src="${featuredItem.poster}" class="hero-img" alt="${featuredItem.title}" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=1200'">
                <div class="hero-content">
                    <span class="hero-badge">${featuredItem.isLive ? 'Live Now' : 'Featured Stream'}</span>
                    <h1 class="hero-title">${featuredItem.title}</h1>
                    <p class="hero-desc">${featuredItem.synopsis || 'Tune in to our featured stream with high-performance low-latency routing.'}</p>
                    <a href="${featuredItem.link}" class="hero-btn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        Watch Stream
                    </a>
                </div>
            </div>
        `;
    }

    function renderGrids() {
        const term = searchInput.value.toLowerCase();
        const cat = categoryFilter.value;
        
        let filtered = allData.filter(item => {
            if (isLiveOnly && !item.isLive) return false;
            if (cat !== 'all' && item.type !== cat) return false;
            if (term && !item.title.toLowerCase().includes(term)) return false;
            return true;
        });

        if (filtered.length === 0) {
            contentArea.innerHTML = `<div class="loading">No streams match your search filters.</div>`;
            return;
        }

        // Group structures to keep directories separated elegantly
        const groups = {};
        filtered.forEach(item => {
            const groupName = item.type === 'sports' ? 'Live Sports Catalog' : '24/7 TV Channels';
            if(!groups[groupName]) groups[groupName] = [];
            groups[groupName].push(item);
        });

        let html = '';
        for (const [groupName, items] of Object.entries(groups)) {
            html += `
                <div class="section-title">${groupName}</div>
                <div class="grid">
            `;
            items.forEach(item => {
                html += `
                    <div class="card" onclick="window.location.href='${item.link}'">
                        ${item.isLive ? `<div class="badge-live">LIVE</div>` : ''}
                        <div class="card-img-container">
                            <img src="${item.poster}" class="card-img" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=600'">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">
                                <span>${item.category.toUpperCase()}</span>
                                <span style="color: ${item.isLive ? 'var(--live-red)' : 'inherit'}">${item.statusText || 'VOD'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        contentArea.innerHTML = html;
    }

    // Interactive event listeners
    searchInput.addEventListener('input', renderGrids);
    categoryFilter.addEventListener('change', renderGrids);
    liveToggle.addEventListener('click', () => {
        isLiveOnly = !isLiveOnly;
        liveToggle.classList.toggle('active', isLiveOnly);
        renderGrids();
    });

    loadData();
</script>
</body>
</html>
